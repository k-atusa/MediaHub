name: Release

# Builds multi-platform Go binaries (with embedded static web client)
# and automatically creates a GitHub Release when changes are pushed to main or a version tag is pushed.
#
# Binary Filename Convention:
#   mediahub-server-{version}-{os}-{arch}[.exe]
#
# Target Architectures:
#   - Windows x86_64: mediahub-server-{version}-windows-amd64.exe
#   - Windows arm64:  mediahub-server-{version}-windows-arm64.exe
#   - macOS arm64:    mediahub-server-{version}-darwin-arm64
#   - Linux x86_64:   mediahub-server-{version}-linux-amd64
#   - Linux arm64:    mediahub-server-{version}-linux-arm64

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Multi-Platform Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Release Metadata
        id: meta
        run: |
          VERSION="1.4.1"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG_VER="${TAG#v}"
            if [[ -n "${TAG_VER}" ]]; then
              VERSION="${TAG_VER}"
            fi
            NAME="MediaHub ${TAG}"
          else
            YMD="$(date -u +%Y%m%d)"
            SHA_SHORT="${GITHUB_SHA::7}"
            TAG="v${VERSION}-${YMD}-${SHA_SHORT}"
            NAME="MediaHub v${VERSION} (${YMD}.${SHA_SHORT})"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Release Tag:     ${TAG}"
          echo "Release Version: ${VERSION}"
          echo "Release Name:    ${NAME}"

      # ---- Server Cross Compilation (Go) ----
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Multi-Platform Binaries
        run: |
          set -euo pipefail
          mkdir -p build
          VERSION="${{ steps.meta.outputs.version }}"

          PLATFORMS=(
            "windows/amd64/mediahub-server-${VERSION}-windows-amd64.exe"
            "windows/arm64/mediahub-server-${VERSION}-windows-arm64.exe"
            "darwin/arm64/mediahub-server-${VERSION}-darwin-arm64"
            "linux/amd64/mediahub-server-${VERSION}-linux-amd64"
            "linux/arm64/mediahub-server-${VERSION}-linux-arm64"
          )

          cd server
          for ITEM in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH OUT_NAME <<< "${ITEM}"
            echo "==> Building ${OS}/${ARCH} -> build/${OUT_NAME}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build \
              -ldflags="-s -w" \
              -trimpath \
              -o "../build/${OUT_NAME}" \
              server.go
          done
          cd ..

          echo "==> Generating SHA256 Checksums..."
          cd build
          sha256sum mediahub-server-* > checksums.txt
          cat checksums.txt
          cd ..

      # ---- Publish Release ----
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/mediahub-server-*
            build/checksums.txt
