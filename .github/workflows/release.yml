name: Release

# Multi-platform Go binary build & release workflow.
# Triggered when a release with 'vX.X.X' format is published manually.
# Builds multi-platform binaries from the 'main' branch and attaches them to the release.
#
# Binary Filename Convention:
#   mediahub-server-{version}-{os}-{arch}[.exe]
#
# Target Architectures:
#   - Windows x86_64: mediahub-server-{version}-windows-amd64.exe
#   - Windows arm64:  mediahub-server-{version}-windows-arm64.exe
#   - macOS arm64:    mediahub-server-{version}-darwin-arm64
#   - Linux x86_64:   mediahub-server-{version}-linux-amd64
#   - Linux arm64:    mediahub-server-{version}-linux-arm64

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.5.2)'
        required: true
        default: 'v1.5.2'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Attach Multi-Platform Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute Release Metadata
        id: meta
        run: |
          set -euo pipefail

          RAW_TAG="${{ github.event.release.tag_name || inputs.tag }}"
          RELEASE_NAME="${{ github.event.release.name || '' }}"

          echo "Event Release Tag:  ${RAW_TAG}"
          echo "Event Release Name: ${RELEASE_NAME}"

          # Extract semantic version pattern (vX.X.X) from Tag or Name
          VERSION=""
          if [[ "${RAW_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$(echo "${RAW_TAG}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          elif [[ "${RELEASE_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$(echo "${RELEASE_NAME}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "::error::Release tag ('${RAW_TAG}') or name ('${RELEASE_NAME}') does not match expected 'vX.X.X' format."
            exit 1
          fi

          TAG="${RAW_TAG:-v${VERSION}}"
          if [[ "${TAG}" != v* ]]; then
            TAG="v${TAG}"
          fi

          echo "Resolved Version: ${VERSION}"
          echo "Resolved Tag:     ${TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # ---- Server Cross Compilation (Go) ----
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Multi-Platform Binaries
        run: |
          set -euo pipefail
          mkdir -p build
          VERSION="${{ steps.meta.outputs.version }}"

          PLATFORMS=(
            "windows/amd64/mediahub-server-${VERSION}-windows-amd64.exe"
            "windows/arm64/mediahub-server-${VERSION}-windows-arm64.exe"
            "darwin/arm64/mediahub-server-${VERSION}-darwin-arm64"
            "linux/amd64/mediahub-server-${VERSION}-linux-amd64"
            "linux/arm64/mediahub-server-${VERSION}-linux-arm64"
          )

          cd server
          for ITEM in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH OUT_NAME <<< "${ITEM}"
            echo "==> Building ${OS}/${ARCH} -> build/${OUT_NAME}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build \
              -ldflags="-s -w" \
              -trimpath \
              -o "../build/${OUT_NAME}" \
              server.go
          done
          cd ..

          echo "==> Generating SHA256 Checksums..."
          cd build
          sha256sum mediahub-server-* > checksums.txt
          cat checksums.txt
          cd ..

      # ---- Attach Binaries to Release ----
      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/mediahub-server-*
            build/checksums.txt
