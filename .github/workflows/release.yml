name: Release

# Builds multi-platform Go binaries (with embedded Next.js frontend)
# and automatically creates a GitHub Release when changes are pushed to main.
#
# Target Architectures:
#   - Windows x86_64: mediahub-windows-amd64.exe
#   - Windows arm64:  mediahub-windows-arm64.exe
#   - macOS arm64:    mediahub-darwin-arm64
#   - Linux x86_64:   mediahub-linux-amd64
#   - Linux arm64:    mediahub-linux-arm64

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Multi-Platform Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Compute Release Metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="MediaHub ${TAG}"
          else
            VERSION=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "1.0.0")
            YMD="$(date -u +%Y%m%d)"
            SHA_SHORT="${GITHUB_SHA::7}"
            TAG="v${VERSION}-${YMD}-${SHA_SHORT}"
            NAME="MediaHub v${VERSION} (${YMD}.${SHA_SHORT})"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Release Tag:  ${TAG}"
          echo "Release Name: ${NAME}"

      # ---- Frontend Build ----
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend (Next.js static export & copy to backend/dist)
        working-directory: frontend
        run: npm run build

      # ---- Backend Cross Compilation (Go) ----
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build Multi-Platform Binaries
        run: |
          set -euo pipefail
          mkdir -p build

          PLATFORMS=(
            "windows/amd64/mediahub-windows-amd64.exe"
            "windows/arm64/mediahub-windows-arm64.exe"
            "darwin/arm64/mediahub-darwin-arm64"
            "linux/amd64/mediahub-linux-amd64"
            "linux/arm64/mediahub-linux-arm64"
          )

          cd backend
          for ITEM in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH OUT_NAME <<< "${ITEM}"
            echo "==> Building ${OS}/${ARCH} -> build/${OUT_NAME}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build \
              -ldflags="-s -w" \
              -trimpath \
              -o "../build/${OUT_NAME}" \
              server.go
          done
          cd ..

          echo "==> Generating SHA256 Checksums..."
          cd build
          sha256sum mediahub-* > checksums.txt
          cat checksums.txt
          cd ..

      # ---- Publish Release ----
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/mediahub-windows-amd64.exe
            build/mediahub-windows-arm64.exe
            build/mediahub-darwin-arm64
            build/mediahub-linux-amd64
            build/mediahub-linux-arm64
            build/checksums.txt
