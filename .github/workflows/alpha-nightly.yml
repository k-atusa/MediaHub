name: Alpha Nightly

# Builds the Next.js frontend, the Go server binary, and publishes an
# alpha-nightly GitHub Release. Triggered on every push to main.
#
# Release assets:
#   - mediahub-YYMMDD-SHORT_SHA-linux-amd64         (Go server binary with embedded HTML)
#   - mediahub-web-YYMMDD-SHORT_SHA.zip             (static Next.js frontend assets)
#
# Release name: Alpha Nightly - YYYYMMDD (SHORT_SHA)
# Release tag:  alpha-YYYYMMDD-SHORT_SHA
# Marked as a pre-release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: alpha-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Alpha Nightly
    runs-on: ubuntu-latest

    steps:
      - name: Compute release identifiers
        id: ids
        run: |
          # YYYYMMDD and YYMMDD in UTC to match the example in the spec.
          YMD="$(date -u +%Y%m%d)"
          YMD_SHORT="$(date -u +%y%m%d)"
          SHA_SHORT="${GITHUB_SHA::7}"
          TAG="alpha-${YMD}-${SHA_SHORT}"
          NAME="Alpha Nightly - ${YMD} (${SHA_SHORT})"
          BIN_NAME="mediahub-${YMD_SHORT}-${SHA_SHORT}-linux-amd64"
          WEB_NAME="mediahub-web-${YMD_SHORT}-${SHA_SHORT}.zip"

          {
            echo "ymd=${YMD}"
            echo "ymd_short=${YMD_SHORT}"
            echo "sha_short=${SHA_SHORT}"
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "bin_name=${BIN_NAME}"
            echo "web_name=${WEB_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Tag:    ${TAG}"
          echo "Name:   ${NAME}"
          echo "Binary: ${BIN_NAME}"
          echo "Web:    ${WEB_NAME}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Frontend (Next.js static export) ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build
        env:
          WEB_NAME: ${{ steps.ids.outputs.web_name }}

      - name: Zip static frontend
        working-directory: backend/dist
        env:
          WEB_NAME: ${{ steps.ids.outputs.web_name }}
        run: |
          set -euo pipefail
          OUT="../../${WEB_NAME}"
          zip -r "${OUT}" .

      # ---- Backend (Go) ----
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Build Go binary (linux/amd64, static with embedded frontend)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: 'linux'
          GOARCH: 'amd64'
          BIN_NAME: ${{ steps.ids.outputs.bin_name }}
        run: |
          set -euo pipefail
          go build \
            -ldflags="-s -w" \
            -trimpath \
            -o "${BIN_NAME}" \
            server.go

      - name: Verify Go binary
        working-directory: backend
        env:
          BIN_NAME: ${{ steps.ids.outputs.bin_name }}
        run: |
          set -euo pipefail
          file "${BIN_NAME}"
          ls -lh "${BIN_NAME}"

      # ---- Release ----
      - name: Publish Alpha Nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ids.outputs.tag }}
          name: ${{ steps.ids.outputs.name }}
          prerelease: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            backend/${{ steps.ids.outputs.bin_name }}
            ${{ steps.ids.outputs.web_name }}